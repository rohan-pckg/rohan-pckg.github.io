<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://rohan-pckg.github.io/gallery/" />
    <title>space / gallery</title>
    <meta
      name="description"
      content="A small, quiet gallery of images from this corner of the internet."
    />
    <link rel="stylesheet" type="text/css" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <main>
        <section class="section">
          <h1 class="title">Gallery</h1>
          <p class="body-text">A small, quiet collection of images.</p>
        </section>

        <section class="section gallery">
          <figure>
            <img
              src="../assets/Fedora-xfce.jpeg"
              alt="Fedora Linux running the Xfce desktop environment"
              width="1600"
              height="900"
              loading="lazy"
              decoding="async"
            />
            <figcaption>Fedora + Xfce — my desktop setup.</figcaption>
          </figure>

          <figure>
            <img
              src="../assets/pfp.jpg"
              alt="Profile photo"
              width="300"
              height="200"
              loading="lazy"
              decoding="async"
            />
            <figcaption>[ add a caption ]</figcaption>
          </figure>

          <figure>
            <img
              src="../assets/banner.png"
              alt="Site banner image"
              width="740"
              height="476"
              loading="lazy"
              decoding="async"
            />
            <figcaption>[ add a caption ]</figcaption>
          </figure>
        </section>
      </main>

      <footer class="site-footer">
        <a class="navigation-link" href="../">/..</a>
      </footer>
    </div>
  </body>
</html>
